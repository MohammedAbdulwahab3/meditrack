# Render Blueprint: one web service (API + website) and a Postgres database.
# Free plan notes: the web service sleeps after 15 minutes idle (first request then takes
# ~1 minute), and a free database expires 30 days after creation unless upgraded.
services:
  - type: web
    name: meditrack
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meditrack-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # "true" loads demo pharmacies and accounts on boot (idempotent). Keep "false" for real use.
      - key: SEED_DEMO
        value: "false"

databases:
  - name: meditrack-db
    plan: free
    region: frankfurt
    databaseName: meditrack
    user: meditrack
    postgresMajorVersion: "16"
